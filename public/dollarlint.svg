  <style>
svg {
  --logo-outer-fill: #24533f;
  --logo-outer-highlight: #32694c;
  --logo-inner-fill: #edf4df;
  --logo-inner-highlight: #fbfae9;
  --logo-seal-fill: #c9dec2;
  --logo-seal-highlight: #dbe9d1;
  --logo-oval-fill: #bfd5bb;
  --logo-check: var(--green-dark);
  --logo-texture-ink: rgba(15, 90, 63, 0.34);
  --logo-texture-paper: rgba(251, 247, 232, 0.5);
  --green-dark: #093626;
}
.site-logo__outer-fill {
  fill: url("#site-logo-outer-gradient");
}
.site-logo__inner-fill {
  fill: url("#site-logo-inner-gradient");
}
.site-logo__seal-fill {
  fill: url("#site-logo-seal-gradient");
}
.site-logo__oval-fill {
  fill: var(--logo-oval-fill);
}
.site-logo__outer-stop-start {
  stop-color: var(--logo-outer-highlight);
}
.site-logo__outer-stop-end {
  stop-color: var(--logo-outer-fill);
}
.site-logo__inner-stop-start {
  stop-color: var(--logo-inner-highlight);
}
.site-logo__inner-stop-end {
  stop-color: var(--logo-inner-fill);
}
.site-logo__seal-stop-start {
  stop-color: var(--logo-seal-highlight);
}
.site-logo__seal-stop-end {
  stop-color: var(--logo-seal-fill);
}
.site-logo__texture {
  fill: url("#site-logo-paper-texture");
  opacity: 0.28;
}
.site-logo__texture--inner {
  opacity: 0.36;
}
.site-logo__texture--seal {
  opacity: 0.22;
}
.site-logo__texture-line {
  fill: none;
  stroke: var(--logo-texture-paper);
  stroke-width: 1.5;
}
.site-logo__texture-dot {
  fill: var(--logo-texture-ink);
}
.site-logo__check {
  fill: none;
  stroke: var(--logo-check);
}
  </style>
